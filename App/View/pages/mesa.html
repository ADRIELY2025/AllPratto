{% extends 'layouts/main.html' %}

{% block breadcrumbs %}
<ol class="breadcrumb float-sm-end">
    <li class="breadcrumb-item"><a href="/">Início</a></li>
    <li class="breadcrumb-item"><a href="/mesa/lista">Lista de mesas</a></li>
    <li class="breadcrumb-item active" aria-current="page">Detalhes da mesa</li>
</ol>
{% endblock %}

{% block main %}
<form id="form">
    <input type="hidden" id="action" name="action" value="{{ action }}">
    <input type="hidden" id="id"     name="id"     value="{{ id }}">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <a href="/mesa/lista" class="btn btn-warning">
                        <i class="fa-solid fa-chevron-left"></i>
                        Voltar
                    </a>
                </div>
                <div class="card-body">
                    <div class="row">

                        <div class="col-lg-3 col-md-4 col-sm-6">
                            <div class="form-floating mb-3">
                                <input autofocus type="number" class="form-control"
                                    id="numero" name="numero"
                                    placeholder="Número da mesa"
                                    value="{{ mesa.numero }}" required>
                                <label for="numero">Número da mesa</label>
                            </div>
                        </div>

                        <div class="col-lg-3 col-md-4 col-sm-6">
                            <div class="form-floating mb-3">
                                <input type="number" class="form-control"
                                    id="capacidade" name="capacidade"
                                    placeholder="Capacidade (pessoas)"
                                    value="{{ mesa.capacidade }}">
                                <label for="capacidade">Capacidade (pessoas)</label>
                            </div>
                        </div>

                        <div class="col-lg-3 col-md-4 col-sm-6">
                            <div class="form-floating mb-3">
                                <select class="form-select" id="status" name="status">
                                    <option value="livre"     {% if mesa.status == 'livre'     %}selected{% endif %}>Livre</option>
                                    <option value="ocupada"   {% if mesa.status == 'ocupada'   %}selected{% endif %}>Ocupada</option>
                                    <option value="reservada" {% if mesa.status == 'reservada' %}selected{% endif %}>Reservada</option>
                                    <option value="inativa"   {% if mesa.status == 'inativa'   %}selected{% endif %}>Inativa</option>
                                </select>
                                <label for="status">Status</label>
                            </div>
                        </div>

                        <div class="col-12">
                            <div class="form-floating mb-3">
                                <textarea class="form-control" id="observacao" name="observacao"
                                    placeholder="Observação" style="height: 80px">{{ mesa.observacao }}</textarea>
                                <label for="observacao">Observação</label>
                            </div>
                        </div>

                        <div class="form-group mt-1">
                            <div class="icheck-primary d-inline">
                                <input class="form-check-input" type="checkbox"
                                    id="ativo" name="ativo" value="true"
                                    {% if mesa.ativo %} checked {% endif %}>
                                <label for="ativo">Ativo?</label>
                            </div>
                        </div>

                    </div>
                </div>
                <div class="card-footer">
                    <button id="insert" type="button" class="btn btn-success">
                        <i class="fa-solid fa-floppy-disk"></i>
                        Salvar
                    </button>
                </div>
            </div>
        </div>
    </div>
</form>
{% endblock %}

{% block script %}
{{ vite('resources/js/pages/mesa.js') }}
{% endblock %}
